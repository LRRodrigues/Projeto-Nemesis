version: '3.8'

services:
  # --- 1. O ORÁCULO (DNS) ---
  dns-oracle:
    build: ./dns
    container_name: dns-oracle
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks:
      nemesis_net:
        ipv4_address: 172.28.0.10
    cap_add:
      - NET_ADMIN

  # --- 2. O ARQUIVO (Banco de Dados & Sessão) ---
  db-archive:
    image: postgres:15-alpine
    container_name: db-archive
    hostname: db.nemesis.local
    environment:
      POSTGRES_USER: nemesis_admin
      POSTGRES_PASSWORD: nemesis_secure_password
      POSTGRES_DB: nemesis_db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      nemesis_net:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemesis_admin -d nemesis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 3, 4, 5. A FROTA (App Servers) ---
  app-pod-1:
    build: ./app
    container_name: app-pod-1
    hostname: app-pod-1
    depends_on:
      db-archive:
        condition: service_healthy
    environment: &app-env
      DB_HOST: 172.28.0.20
      DB_USER: nemesis_admin
      DB_PASSWORD: nemesis_secure_password
      DB_NAME: nemesis_db
      SESSION_SECRET: SegredoEspacialDeAltoNivel2024
    networks:
      nemesis_net:
        ipv4_address: 172.28.1.1

  app-pod-2:
    build: ./app
    container_name: app-pod-2
    hostname: app-pod-2
    depends_on:
      db-archive:
        condition: service_healthy
    environment: *app-env
    networks:
      nemesis_net:
        ipv4_address: 172.28.1.2

  app-pod-3:
    build: ./app
    container_name: app-pod-3
    hostname: app-pod-3
    depends_on:
      db-archive:
        condition: service_healthy
    environment: *app-env
    networks:
      nemesis_net:
        ipv4_address: 172.28.1.3

networks:
  nemesis_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
